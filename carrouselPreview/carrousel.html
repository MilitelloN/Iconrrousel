<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Icon Carrusel</title>
    <link rel="stylesheet" href="miCarr.css">
</head>

<body>
    <h1>BIENVENIDO A MI CARROUSEL DE ICONOS</h1>

    <div class="carousel-shell">
        <button class="nav-btn prev" aria-label="Anterior" type="button">◀</button>

        <div class="viewport">
            <ul class="track" aria-label="Iconos">
                <li class="tile"><span>icono 1</span></li>
                <li class="tile"><span>icono 2</span></li>
                <li class="tile"><span>icono 3</span></li>
                <li class="tile"><span>icono 4</span></li>
                <li class="tile"><span>icono 5</span></li>
                <li class="tile"><span>icono 6</span></li>
                <li class="tile"><span>icono 7</span></li>
                <li class="tile"><span>icono 8</span></li>
                <li class="tile"><span>icono 8</span></li>
                <li class="tile"><span>icono 8</span></li>
                <li class="tile"><span>icono 8</span></li>
                <li class="tile"><span>icono 8</span></li>
                <li class="tile"><span>icono 8</span></li>
                <li class="tile"><span>icono 8</span></li>
                <li class="tile"><span>icono 8</span></li>
                <li class="tile"><span>icono 8</span></li>
                <li class="tile"><span>icono 8</span></li>
            </ul>
        </div>

        <button class="nav-btn next" aria-label="Siguiente" type="button">▶</button>
    </div>

    <script>
        (function () {
            const scroller = document.querySelector('.track');
            const prev = document.querySelector('.prev');
            const next = document.querySelector('.next');
            const gap = 18;

            const unit = () => {
                const first = scroller.querySelector('.tile');
                if (!first) return 0;
                const rect = first.getBoundingClientRect();
                return rect.width + gap;
            };

            const visibleCount = () => {
                const u = unit();
                if (!u) return 1;
                return Math.max(1, Math.floor((scroller.clientWidth + gap) / u));
            };

            const step = () => {
                const u = unit();
                if (!u) return 0;
                const y = visibleCount();
                const x = Math.max(1, y - 1); // move by Y-1 items; fallback to 1
                return u * x;
            };

            const updateButtons = () => {
                const max = scroller.scrollWidth - scroller.clientWidth;
                const x = scroller.scrollLeft;
                prev.disabled = x <= 0;
                next.disabled = x >= max - 1;
            };

            const scrollByStep = (dir) => {
                scroller.scrollBy({ left: step() * dir, behavior: 'smooth' });
            };

            prev.addEventListener('click', () => scrollByStep(-1));
            next.addEventListener('click', () => scrollByStep(1));
            scroller.addEventListener('scroll', updateButtons, { passive: true });

            requestAnimationFrame(updateButtons);
        })();
    </script>
</body>
